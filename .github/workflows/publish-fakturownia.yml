name: Publish n8n-nodes-faktoapp-fakturownia

on:
  push:
    tags:
      - 'fakturownia-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: packages/n8n-nodes-fakturownia

      - name: Build
        run: npm run build
        working-directory: packages/n8n-nodes-fakturownia

      - name: Test
        run: npm test
        working-directory: packages/n8n-nodes-fakturownia

      - name: Publish with provenance
        run: npm publish --provenance --access public
        working-directory: packages/n8n-nodes-fakturownia
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
